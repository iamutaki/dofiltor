<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --c-bg: #ffffff;
      --c-bg-hover: #f1f3f4;
      --c-bg-section: #f8f9fa;
      --c-border: #dadce0;
      --c-text: #202124;
      --c-text-2: #5f6368;
      --c-text-3: #80868b;
      --c-blue: #1a73e8;
      --c-blue-bg: #e8f0fe;
      --c-red: #d93025;
      --c-red-bg: #fce8e6;
      --c-green: #1e8e3e;
      --c-orange: #e37400;
      --c-badge-bg: #d8eee8;
      --c-badge-text: #24584f;
    }
    [data-theme="dark"] {
      --c-bg: #292a2d; --c-bg-hover: #35363a; --c-bg-section: #202124;
      --c-border: #3c4043; --c-text: #e8eaed; --c-text-2: #9aa0a6; --c-text-3: #5f6368;
      --c-blue: #8ab4f8; --c-blue-bg: #1a3352; --c-red: #f28b82; --c-red-bg: #3c1f1e;
      --c-green: #81c995; --c-orange: #fcad70;
      --c-badge-bg: #243d39; --c-badge-text: #9bcfc7;
    }
    @media (prefers-color-scheme: dark) {
      [data-theme="auto"] {
        --c-bg: #292a2d; --c-bg-hover: #35363a; --c-bg-section: #202124;
        --c-border: #3c4043; --c-text: #e8eaed; --c-text-2: #9aa0a6; --c-text-3: #5f6368;
        --c-blue: #8ab4f8; --c-blue-bg: #1a3352; --c-red: #f28b82; --c-red-bg: #3c1f1e;
        --c-green: #81c995; --c-orange: #fcad70;
        --c-badge-bg: #243d39; --c-badge-text: #9bcfc7;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 380px;
      height: 600px;
      max-height: 600px;
      overflow: hidden;
    }

    body {
      font-family: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px; color: var(--c-text); background: var(--c-bg);
      display: flex; flex-direction: column;
      min-height: 0;
    }

    .captcha-banner {
      display: none; padding: 6px 10px;
      background: var(--c-red-bg); border-bottom: 1px solid var(--c-red);
      font-size: 11px; flex-shrink: 0; align-items: center; gap: 6px;
    }
    .captcha-banner.show { display: flex; }
    .captcha-banner svg { width: 14px; height: 14px; fill: var(--c-red); flex-shrink: 0; }
    .captcha-banner span { flex: 1; color: var(--c-red); font-weight: 500; }
    .captcha-banner button {
      padding: 2px 8px; border: 1px solid var(--c-red); border-radius: 3px;
      background: transparent; color: var(--c-red); cursor: pointer;
      font-size: 10px; font-weight: 500;
    }
    .captcha-banner button:hover { background: var(--c-red); color: #fff; }

    .header {
      padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .logo {
      width: 24px; height: 24px; flex-shrink: 0;
      display: block; border-radius: 50%;
    }
    .header-info { flex: 1; min-width: 0; }
    .header-info h1 {
      font-size: 13px; font-weight: 500; line-height: 1.2;
      display: flex; align-items: baseline; gap: 6px; min-width: 0;
    }
    .header-info h1 .app-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-info .app-ver {
      font-size: 10px; font-weight: 400; color: var(--c-text-3);
      flex-shrink: 0; font-variant-numeric: tabular-nums;
    }
    .header-info p { font-size: 10px; color: var(--c-text-2); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scope-bar {
      height: 28px; padding: 5px 12px; border-top: 1px solid var(--c-border);
      border-bottom: 1px solid var(--c-border); background: var(--c-bg-section);
      display: flex; align-items: center; gap: 7px; flex-shrink: 0;
      font-size: 11px; color: var(--c-text-2);
    }
    .scope-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-border); flex-shrink: 0; }
    .scope-bar.collecting .scope-dot { background: var(--c-green); }
    .scope-bar.paused .scope-dot { background: var(--c-orange); }
    .scope-bar.unsupported .scope-dot,
    .scope-bar.permission .scope-dot { background: var(--c-red); }
    .scope-bar span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pwr-btn {
      width: 28px; height: 28px; border: none; border-radius: 50%;
      background: transparent; color: var(--c-text-2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s, color 0.1s; flex-shrink: 0; padding: 0;
    }
    .pwr-btn:hover, .pwr-btn:focus-visible { background: var(--c-bg-hover); outline: 1px solid var(--c-blue); outline-offset: 1px; }
    .pwr-btn.on { color: var(--c-green); }
    .pwr-btn.off { color: var(--c-red); }
    .pwr-btn svg { width: 17px; height: 17px; fill: currentColor; }

    /* ── Auto-next control bar ── */
    .auto-bar {
      padding: 6px 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
      border-bottom: 1px solid var(--c-border); background: var(--c-bg-section);
      font-size: 11px; color: var(--c-text-2);
    }
    .auto-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 14px; border-radius: 14px; cursor: pointer;
      border: 1px solid var(--c-border); background: transparent;
      color: var(--c-text-2); font-size: 12px; font-weight: 500;
      font-family: inherit; transition: all 0.15s; white-space: nowrap;
      height: 30px;
    }
    .auto-btn:hover { border-color: var(--c-blue); color: var(--c-blue); background: var(--c-blue-bg); }
    .auto-btn.on { border-color: var(--c-blue); background: var(--c-blue); color: #fff; }
    .auto-btn .dot-on {
      width: 7px; height: 7px; border-radius: 50%; background: var(--c-green);
      animation: pulse 1.5s ease-in-out infinite;
    }
    .auto-btn .dot-off {
      width: 7px; height: 7px; border-radius: 50%; background: var(--c-border);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .auto-bar .spacer { flex: 1; }
    .auto-bar .pg-label { font-size: 10px; color: var(--c-text-3); }
    .max-pages {
      width: 48px; padding: 3px 6px; border: 1px solid var(--c-border);
      border-radius: 4px; font-size: 12px; text-align: center;
      background: var(--c-bg); color: var(--c-text); outline: none;
      font-family: inherit;
    }
    .max-pages:focus { border-color: var(--c-blue); }
    .auto-bar .pg-suffix { font-size: 10px; color: var(--c-text-3); }
    .auto-status {
      font-size: 10px; color: var(--c-text-3); white-space: nowrap;
    }

    .ib {
      width: 28px; height: 28px; border: none; border-radius: 50%;
      background: transparent; color: var(--c-text-2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s, color 0.1s; flex-shrink: 0; position: relative;
    }
    .ib:hover, .ib:focus-visible { background: var(--c-bg-hover); color: var(--c-text); outline: 1px solid var(--c-blue); outline-offset: 1px; }
    .ib svg { width: 16px; height: 16px; fill: currentColor; }
    .ib.danger:hover { color: var(--c-red); }
    .ib .badge {
      position: absolute; top: -2px; right: -2px;
      min-width: 13px; height: 13px; display: flex; align-items: center; justify-content: center;
      font-size: 7px; font-weight: 700; color: #fff;
      background: var(--c-blue); border-radius: 7px;
      padding: 0 3px; line-height: 1; pointer-events: none;
    }
    .ib .badge.dl { background: var(--c-badge-bg); color: var(--c-badge-text); border: 1px solid rgba(127,127,127,0.2); }
    .ib .badge.sel { background: var(--c-green); color: #fff; }

    [data-tip] { position: relative; }

    /* JS-positioned tooltip */
    .tip {
      position: fixed; z-index: 9999;
      padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 400;
      background: var(--c-text); color: var(--c-bg); white-space: nowrap;
      pointer-events: none; opacity: 0; transition: opacity 0.1s;
      line-height: 1.4;
    }
    .tip.show { opacity: 1; }

    .stats {
      display: flex; border-top: 1px solid var(--c-border);
      border-bottom: 1px solid var(--c-border); flex-shrink: 0;
    }
    .stat { flex: 1; text-align: center; padding: 6px 0; }
    .stat.actionable { cursor: pointer; }
    .stat.actionable:hover, .stat.actionable:focus-visible {
      background: var(--c-bg-hover); outline: 1px solid var(--c-blue); outline-offset: -1px;
    }
    .stat + .stat { border-left: 1px solid var(--c-border); }
    .sv { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .sv.b { color: var(--c-blue); }
    .sv.m { color: var(--c-text-2); }
    .sl { font-size: 9px; color: var(--c-text-3); margin-top: 0; }

    .toolbar {
      padding: 4px 6px; display: flex; gap: 2px;
      border-bottom: 1px solid var(--c-border); flex-shrink: 0; align-items: center;
    }
    .spacer { flex: 1; }

    .mini-select {
      height: 26px; border: 1px solid var(--c-border); border-radius: 4px;
      background: var(--c-bg); color: var(--c-text); font: inherit; font-size: 10px;
      padding: 0 4px; outline: none; max-width: 96px;
    }
    .mini-select:focus { border-color: var(--c-blue); }
    .sort-dir-btn {
      width: 26px; height: 26px; border: 1px solid var(--c-border); border-radius: 4px;
      background: var(--c-bg); color: var(--c-text-2); cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .sort-dir-btn:hover, .sort-dir-btn:focus-visible {
      border-color: var(--c-blue); color: var(--c-blue); outline: none;
    }
    .sort-dir-btn svg { width: 15px; height: 15px; fill: currentColor; }

    .sort-toolbar {
      background: var(--c-bg-section);
    }
    .selection-actions {
      display: none;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .selection-actions.show { display: flex; }

    .settings-panel {
      display: none; flex-shrink: 0; padding: 8px 10px; gap: 7px;
      border-bottom: 1px solid var(--c-border); background: var(--c-bg-section);
      grid-template-columns: 1fr 1fr; align-items: center;
    }
    .settings-panel.show { display: grid; }
    .setting-field { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--c-text-2); }
    .setting-field input[type="number"] {
      width: 58px; padding: 3px 5px; border: 1px solid var(--c-border); border-radius: 4px;
      background: var(--c-bg); color: var(--c-text); font: inherit; font-size: 11px;
    }
    .setting-field input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--c-blue); }

    .search-bar {
      height: 32px; padding: 4px 8px; border-bottom: 1px solid var(--c-border);
      flex-shrink: 0; display: flex; align-items: center; gap: 6px;
      background: var(--c-bg-section);
    }
    .search-bar svg { width: 14px; height: 14px; fill: var(--c-text-3); flex-shrink: 0; }
    .search-bar input {
      flex: 1; height: 22px; border: none; outline: none; background: transparent;
      font-family: inherit; font-size: 11px; color: var(--c-text);
    }
    .search-bar input::placeholder { color: var(--c-text-3); }
    .search-clear {
      width: 22px; height: 22px; border: none; border-radius: 50%;
      background: transparent; color: var(--c-text-3); cursor: pointer;
      display: none; align-items: center; justify-content: center;
      font-size: 13px; line-height: 1; flex-shrink: 0;
    }
    .search-clear svg { width: 14px; height: 14px; fill: currentColor; }
    .search-clear:hover { background: var(--c-bg-hover); color: var(--c-text); }
    .search-clear.show { display: flex; }

    .domain-bar {
      padding: 5px 8px; border-bottom: 1px solid var(--c-border);
      flex-shrink: 0; display: none; align-items: center; gap: 3px;
      min-width: 0; width: 100%; max-width: 100%;
      flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
      font-size: 10px; scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch; touch-action: pan-x;
      scrollbar-width: thin; scrollbar-color: var(--c-border) transparent;
    }
    .domain-bar::-webkit-scrollbar { height: 4px; }
    .domain-bar::-webkit-scrollbar-thumb {
      background: var(--c-border); border-radius: 2px;
    }
    .domain-bar.show { display: flex; }
    .dtag {
      flex-shrink: 0; padding: 3px 8px; border-radius: 999px; font-size: 10px;
      background: var(--c-bg-hover); color: var(--c-text-2);
      white-space: nowrap; cursor: pointer; border: 1px solid var(--c-border);
      transition: all 0.1s; font-family: inherit;
    }
    .dtag:hover { border-color: var(--c-blue); color: var(--c-blue); }
    .dtag.active { background: var(--c-blue-bg); color: var(--c-blue); border-color: var(--c-blue); }

    .prog { height: 2px; background: var(--c-border); flex-shrink: 0; overflow: hidden; display: none; }
    .prog.on { display: block; }
    .prog-bar { height: 100%; background: var(--c-blue); width: 0%; transition: width 0.3s; }

    .global-stats {
      padding: 4px 12px 5px;
      font-size: 9px;
      color: var(--c-text-3);
      border-bottom: 1px solid var(--c-border);
      flex-shrink: 0;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: var(--c-bg-section);
    }

    .results-panel {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tabs {
      display: flex; gap: 0; padding: 0; overflow-x: auto;
      border-bottom: 1px solid var(--c-border); flex-shrink: 0;
      background: var(--c-bg-section);
    }
    .tab {
      padding: 6px 12px; border: none; background: transparent;
      font-size: 11px; font-weight: 500; cursor: pointer;
      color: var(--c-text-2); border-bottom: 2px solid transparent;
      white-space: nowrap; transition: color 0.1s;
    }
    .tab:hover { color: var(--c-text); background: var(--c-bg-hover); }
    .tab.on { color: var(--c-blue); border-bottom-color: var(--c-blue); }

    .results-panel > .list,
    .results-panel > .empty {
      flex: 1 1 0;
      min-height: 0;
    }

    .list {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      position: relative;
      overscroll-behavior: contain;
    }
    .list::-webkit-scrollbar { width: 6px; }
    .list::-webkit-scrollbar-track { background: transparent; }
    .list::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 3px; }

    .row {
      padding: 6px 10px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--c-border); transition: background 0.08s;
    }
    .virtual-canvas { position: relative; }
    .virtual-canvas .row {
      position: absolute; left: 0; right: 0; height: 49px;
    }
    .row:last-child { border-bottom: none; }
    .row:hover, .row.selected, .row:focus-visible { background: var(--c-bg-hover); outline: none; }
    .row.multi-selected { background: var(--c-blue-bg); }
    .row.dl { opacity: 0.55; }

    .row-check {
      flex-shrink: 0; width: 14px; height: 14px; accent-color: var(--c-blue);
    }

    .dot { flex-shrink: 0; width: 6px; height: 6px; border-radius: 50%; }
    .dot-ok { background: var(--c-green); }
    .dot-fail { background: var(--c-red); }
    .dot-pending { background: var(--c-border); }

    .ficon {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 5px;
      background: var(--c-bg-section); border: 1px solid var(--c-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; font-weight: 700; text-transform: uppercase;
      color: var(--c-text-2); position: relative; overflow: hidden;
    }
    .ficon::before {
      content: ""; position: absolute; top: 0; right: 0;
      border-top: 7px solid rgba(255,255,255,0.55);
      border-left: 7px solid rgba(0,0,0,0.08);
    }
    .ficon.ext-pdf { background: #fce8e6; border-color: #f4b8b1; color: #a50e0e; }
    .ficon.ext-sheet { background: #e6f4ea; border-color: #b7dfbd; color: #137333; }
    .ficon.ext-doc { background: #e8f0fe; border-color: #aecbfa; color: #174ea6; }
    .ficon.ext-slide { background: #fef7e0; border-color: #fdd663; color: #b06000; }
    .ficon.ext-text { background: #f1f3f4; border-color: #dadce0; color: #3c4043; }
    .ficon.ext-archive { background: #f3e8fd; border-color: #d7aefb; color: #681da8; }
    [data-theme="dark"] .ficon.ext-pdf { background: #3c1f1e; border-color: #5c2b29; color: #f28b82; }
    [data-theme="dark"] .ficon.ext-sheet { background: #18331f; border-color: #2d5a35; color: #81c995; }
    [data-theme="dark"] .ficon.ext-doc { background: #1a3352; border-color: #274f7d; color: #8ab4f8; }
    [data-theme="dark"] .ficon.ext-slide { background: #332800; border-color: #5f4b16; color: #fdd663; }
    [data-theme="dark"] .ficon.ext-text { background: #35363a; border-color: #3c4043; color: #bdc1c6; }
    [data-theme="dark"] .ficon.ext-archive { background: #2f1c45; border-color: #4e2f73; color: #d7aefb; }

    .rinfo { flex: 1; min-width: 0; }
    .rname {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-size: 12px; line-height: 1.3;
    }
    .rname:hover { color: var(--c-blue); }
    .rmeta { font-size: 10px; color: var(--c-text-2); line-height: 1.2; display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; overflow: hidden; min-width: 0; }
    .rmeta .host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex-shrink: 1; }
    .rmeta .sz { color: var(--c-text-3); flex-shrink: 0; white-space: nowrap; }
    .rmeta .dl-tag { color: var(--c-green); font-weight: 500; flex-shrink: 0; white-space: nowrap; }
    .status-chip {
      padding: 1px 5px; border-radius: 999px; font-size: 9px; font-weight: 600; flex-shrink: 0; white-space: nowrap;
      border: 1px solid var(--c-border); color: var(--c-text-3); background: var(--c-bg-section);
    }
    .status-chip.ok {
      color: var(--c-green); border-color: color-mix(in srgb, var(--c-green) 45%, var(--c-border));
      background: color-mix(in srgb, var(--c-green) 12%, transparent);
    }
    .status-chip.fail {
      color: var(--c-red); border-color: color-mix(in srgb, var(--c-red) 45%, var(--c-border));
      background: color-mix(in srgb, var(--c-red) 10%, transparent);
    }
    .row.status-ok .ficon { border-color: color-mix(in srgb, var(--c-green) 40%, var(--c-border)); }
    .row.status-fail .ficon { border-color: color-mix(in srgb, var(--c-red) 45%, var(--c-border)); }

    .racts { display: flex; gap: 0; flex-shrink: 0; opacity: 0; transition: opacity 0.1s; }
    .row:hover .racts { opacity: 1; }

    .empty {
      flex: 1 1 auto;
      min-height: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 36px 20px; text-align: center;
      overflow: hidden;
    }
    .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.15; }
    .empty-t { font-size: 13px; color: var(--c-text); }
    .empty-d { font-size: 11px; color: var(--c-text-2); margin-top: 4px; line-height: 1.4; }

    .empty-list {
      padding: 20px; text-align: center; color: var(--c-text-3); font-size: 11px;
    }

    .history-head {
      padding: 8px 10px; font-size: 11px; font-weight: 500; color: var(--c-text-2);
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--c-border);
    }
    .history-head button, .back-btn {
      background: none; border: 1px solid var(--c-border); border-radius: 4px;
      color: var(--c-text-2); cursor: pointer; font-size: 10px; padding: 4px 10px;
    }
    .history-head button { border: none; color: var(--c-red); }
    .history-row { position: static; }
    .back-btn { display: block; margin: 8px auto; }

    .undo-toast {
      display: none; position: fixed; left: 10px; right: 10px; bottom: 26px;
      padding: 8px 10px; border: 1px solid var(--c-border); border-radius: 6px;
      background: var(--c-bg); box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      align-items: center; gap: 8px; z-index: 9998; font-size: 11px;
    }
    .undo-toast.show { display: flex; }
    .undo-toast span { flex: 1; color: var(--c-text); }
    .undo-toast button {
      border: none; background: transparent; color: var(--c-blue); cursor: pointer;
      font: inherit; font-weight: 500;
    }
    .type-dialog {
      display: none; position: fixed; inset: 0; z-index: 9997;
      background: rgba(0,0,0,0.24); align-items: center; justify-content: center;
      padding: 14px;
    }
    .type-dialog.show { display: flex; }
    .type-panel {
      width: min(340px, 100%); max-height: 420px; overflow: hidden;
      background: var(--c-bg); border: 1px solid var(--c-border); border-radius: 8px;
      box-shadow: 0 14px 36px rgba(0,0,0,0.24); display: flex; flex-direction: column;
    }
    .type-head {
      height: 38px; display: flex; align-items: center; gap: 8px;
      padding: 0 10px; border-bottom: 1px solid var(--c-border);
      font-size: 12px; font-weight: 600;
    }
    .type-head span { flex: 1; }
    .type-list { overflow-y: auto; padding: 6px; }
    .type-row {
      display: flex; align-items: center; gap: 8px; padding: 6px;
      border-radius: 5px; font-size: 11px;
    }
    .type-row:hover { background: var(--c-bg-hover); }
    .type-row .type-name { flex: 1; text-transform: uppercase; font-weight: 600; }
    .type-row .type-count { color: var(--c-text-3); font-variant-numeric: tabular-nums; }

    .footer {
      padding: 4px 12px; border-top: 1px solid var(--c-border);
      font-size: 10px; color: var(--c-text-3);
      display: flex; justify-content: space-between; flex-shrink: 0;
      background: var(--c-bg-section);
    }
  </style>
</head>
<body>
  <div class="captcha-banner" id="captchaBanner">
    <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
    <span data-i18n="captchaDetected">CAPTCHA detected — auto-next paused</span>
    <button id="captchaShow" data-i18n="captchaShow">Show</button>
  </div>

  <div class="header">
    <img class="logo" src="icons/icon48.png" alt="">
    <div class="header-info">
      <h1><span class="app-name" data-i18n="appName">Dofiltor</span><span class="app-ver" id="appVer"></span></h1>
      <p id="hSub" data-i18n="appSubtitle">Dork File Collector</p>
    </div>
    <button class="pwr-btn on" id="pwrToggle" data-tip="Toggle extension" data-i18n-tip="toggleExtension" data-i18n-aria="toggleExtension">
      <svg id="pwrIcon" viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.59-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
    </button>
    <button class="ib" id="btnGithub" data-tip="GitHub repository" data-i18n-tip="githubRepo" data-i18n-aria="githubRepo">
      <svg viewBox="0 0 24 24"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2.15c-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.27-1.68-1.27-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.24 3.34.95.1-.74.4-1.24.72-1.53-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.18A10.9 10.9 0 0 1 12 6.05c.97 0 1.94.13 2.85.39 2.19-1.49 3.15-1.18 3.15-1.18.62 1.58.23 2.75.11 3.04.73.8 1.18 1.83 1.18 3.08 0 4.42-2.69 5.39-5.25 5.67.41.36.77 1.06.77 2.13v3.17c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
    </button>
    <button class="ib" id="themeToggle" data-tip="Theme" data-i18n-tip="themeToggle" data-i18n-aria="themeToggle">
      <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
      <span class="badge" id="themeLbl">A</span>
    </button>
  </div>

  <div class="scope-bar" id="scopeBar">
    <span class="scope-dot"></span>
    <span id="scopeText" data-i18n="scopeUnknown">Checking current tab...</span>
  </div>

  <div class="auto-bar">
    <button class="auto-btn" id="autoNextBtn" data-i18n-aria="autoNext">
      <span class="dot-off" id="autoDot"></span>
      <span id="autoLabel" data-i18n="autoNext">Auto-next</span>
    </button>
    <span class="auto-status" id="autoStatus"></span>
    <span class="spacer"></span>
    <span class="pg-label" data-i18n="max">Max</span>
    <input type="number" class="max-pages" id="maxPages" value="50" min="1" max="200" data-i18n-aria="maxPages">
    <span class="pg-suffix" data-i18n="pages">pages</span>
  </div>

  <div class="stats">
    <div class="stat"><div class="sv b" id="sTotal">0</div><div class="sl" data-i18n="statUrls">URLs</div></div>
    <div class="stat"><div class="sv" id="sOk">&mdash;</div><div class="sl" data-i18n="statValid">Valid</div></div>
    <div class="stat"><div class="sv" id="sFail">&mdash;</div><div class="sl" data-i18n="statDead">Dead</div></div>
    <div class="stat actionable" id="typesStat" role="button" tabindex="0" data-i18n-aria="availableTypes" data-i18n-title="availableTypes"><div class="sv m" id="sTypes">0</div><div class="sl" data-i18n="statTypes">Types</div></div>
  </div>

  <div class="global-stats" id="globalStats" hidden></div>

  <div class="toolbar">
    <button class="ib" id="btnValidate" data-tip="Validate" data-i18n-tip="validate" data-i18n-aria="validate">
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
    </button>
    <select class="mini-select" id="exportFormat" data-i18n-aria="exportFormat">
      <option value="csv" data-i18n="formatCsv">CSV</option>
      <option value="txt" data-i18n="formatTxt">TXT</option>
      <option value="json" data-i18n="formatJson">JSON</option>
      <option value="xlsx" data-i18n="formatXlsx">XLSX</option>
    </select>
    <button class="ib" id="btnExport" data-tip="Export" data-i18n-tip="export" data-i18n-aria="export">
      <svg viewBox="0 0 24 24"><path d="M5 20h14v-7h2v7c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2h7v2H5v14zm7-16V0h2v4h4l-5 5-5-5h4z"/></svg>
    </button>
    <button class="ib" id="btnCopy" data-tip="Copy URLs" data-i18n-tip="copyUrls" data-i18n-aria="copyUrls">
      <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
    </button>
    <button class="ib" id="btnBatchDl" data-tip="Batch download valid" data-i18n-tip="batchDownload" data-i18n-aria="batchDownload">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      <span class="badge dl" id="batchBadge" style="display:none"></span>
    </button>
    <button class="ib" id="btnHistory" data-tip="Scan history" data-i18n-tip="scanHistory" data-i18n-aria="scanHistory">
      <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
    </button>
    <span class="spacer"></span>
    <button class="ib" id="btnSettings" data-tip="Settings" data-i18n-tip="settingsTooltip" data-i18n-aria="settingsTooltip">
      <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.02-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.37-.31-.6-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98L14.5 2.42C14.47 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.5.42L9.12 5.07c-.61.25-1.18.59-1.69.98l-2.49-1c-.23-.08-.48 0-.6.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.08.65-.08.98s.03.66.08.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.37.31.6.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .47-.18.5-.42l.38-2.65c.61-.25 1.18-.59 1.69-.98l2.49 1c.23.08.48 0 .6-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/></svg>
    </button>
    <button class="ib" id="btnAbout" data-tip="About" data-i18n-tip="aboutTooltip" data-i18n-aria="aboutTooltip">
      <svg viewBox="0 0 24 24"><path d="M11 17h2v-6h-2v6zm1-14C6.48 3 2 7.48 2 13s4.48 10 10 10 10-4.48 10-10S17.52 3 12 3zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-12h2V7h-2v2z"/></svg>
    </button>
    <button class="ib danger" id="btnRemoveDead" style="display:none" data-tip="Remove dead" data-i18n-tip="removeDead" data-i18n-aria="removeDead">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
    <button class="ib danger" id="btnClear" data-tip="Clear all" data-i18n-tip="clearAll" data-i18n-aria="clearAll">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <label class="setting-field"><span data-i18n="pageDelay">Page delay</span> <input type="number" id="pageDelay" min="500" step="500" value="3000"> ms</label>
    <label class="setting-field"><span data-i18n="validationDelay">Check delay</span> <input type="number" id="validateDelay" min="0" step="500" value="1500"> ms</label>
    <label class="setting-field"><input type="checkbox" id="autoValidate"> <span data-i18n="autoValidate">Auto-validate</span></label>
    <label class="setting-field"><input type="checkbox" id="reuseValidationCache"> <span data-i18n="reuseValidationCache">Reuse validation cache</span></label>
    <label class="setting-field"><input type="checkbox" id="notifications"> <span data-i18n="notifications">Notifications</span></label>
  </div>

  <div class="search-bar">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchPlaceholder">
    <button class="search-clear" id="searchClear" data-i18n-aria="clearFilters" data-i18n-title="clearFilters">
      <svg viewBox="0 0 24 24"><path d="M13.41 12l4.3-4.29-1.42-1.42L12 10.59 7.71 6.29 6.29 7.71l4.3 4.29-4.3 4.29 1.42 1.42 4.29-4.3 4.29 4.3 1.42-1.42-4.3-4.29z"/></svg>
    </button>
  </div>

  <div class="domain-bar" id="domainBar"></div>

  <div class="toolbar sort-toolbar" data-i18n-aria="sortBy">
    <select class="mini-select" id="sortKey" data-i18n-aria="sortBy">
      <option value="date" data-i18n="sortDate">Date</option>
      <option value="size" data-i18n="sortSize">Size</option>
      <option value="status" data-i18n="sortStatus">Status</option>
      <option value="domain" data-i18n="sortDomain">Domain</option>
      <option value="type" data-i18n="sortType">Type</option>
    </select>
    <button class="sort-dir-btn" id="sortDirBtn" type="button" data-i18n-aria="sortDesc" data-i18n-title="sortDesc">
      <svg id="sortDirIcon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></svg>
    </button>
    <span class="spacer"></span>
    <div class="selection-actions" id="selectionActions">
      <button class="ib" id="btnSelectVisible" data-tip="Select visible" data-i18n-tip="selectVisible" data-i18n-aria="selectVisible">
        <svg viewBox="0 0 24 24"><path d="M3 5h2v2H3V5zm4 0h14v2H7V5zM3 11h2v2H3v-2zm4 0h14v2H7v-2zM3 17h2v2H3v-2zm4 0h7v2H7v-2zm12.29-1.71L21 17l-4 4-2.29-2.29 1.41-1.41.88.88 2.29-2.29z"/></svg>
      </button>
      <button class="ib" id="btnUnselectAll" data-tip="Unselect all" data-i18n-tip="unselectAll" data-i18n-aria="unselectAll">
        <svg viewBox="0 0 24 24"><path d="M3 5h2v2H3V5zm4 0h14v2H7V5zM3 11h2v2H3v-2zm4 0h14v2H7v-2zM3 17h2v2H3v-2zm4 0h8v2H7v-2zm10.41-1L19 17.59 20.59 16 22 17.41 20.41 19 22 20.59 20.59 22 19 20.41 17.41 22 16 20.59 17.59 19 16 17.41 17.41 16z"/></svg>
      </button>
      <button class="ib" id="btnExportSelected" data-tip="Export selected" data-i18n-tip="exportSelected" data-i18n-aria="exportSelected">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8.29 13.29L6.41 12l1.41-1.41 2.89 2.88 5.46-5.46L17.59 9.42l-6.88 6.87z"/></svg>
        <span class="badge sel" id="selectedBadge"></span>
      </button>
    </div>
  </div>

  <div class="prog" id="prog"><div class="prog-bar" id="progBar"></div></div>
  <div class="results-panel">
    <div class="tabs" id="filters"></div>
    <div class="list" id="urlList"></div>
    <div class="empty" id="empty" style="display:none">
      <div class="empty-icon">&#128269;</div>
      <div class="empty-t" data-i18n="emptyTitle">No URLs collected yet</div>
      <div class="empty-d" data-i18n="emptyDesc">Run a dork query on any enabled provider.<br>Matching file URLs appear here automatically.</div>
    </div>
  </div>

  <div class="footer">
    <span id="fLeft" data-i18n="ready">Ready</span>
    <span id="fRight"></span>
  </div>

  <div class="undo-toast" id="undoToast">
    <span id="undoText"></span>
    <button id="undoBtn" type="button" data-i18n="undo">Undo</button>
  </div>
  <div class="type-dialog" id="typeDialog" aria-hidden="true">
    <div class="type-panel" role="dialog" aria-modal="true" aria-labelledby="typeDialogTitle">
      <div class="type-head">
        <span id="typeDialogTitle" data-i18n="availableTypes">Available types</span>
        <button class="ib" id="typeDialogClose" type="button" data-i18n-aria="close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="type-list" id="typeList"></div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="file-types.js"></script>
  <script src="popup.js?v=3.5.0"></script>
</body>
</html>
